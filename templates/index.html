<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hayder Project</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #07070f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,.05) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .card {
      position: relative; z-index: 1;
      background: rgba(14,14,26,.95);
      border: 1px solid rgba(99,102,241,.15);
      border-radius: 18px;
      padding: 48px 40px;
      max-width: 400px; width: 90%;
      text-align: center;
    }
    .icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin: 0 auto 22px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    p { color: #475569; font-size: .9rem; margin-bottom: 28px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.2);
      border-radius: 30px; padding: 8px 18px;
      color: #10b981; font-size: .85rem; font-weight: 600;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981;
           animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.35} }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>Hayder Project</h1>
    <p>Платформа нагрузочного тестирования</p>
    <div class="status">
      <div class="dot"></div>
      Онлайн
    </div>
  </div>
</body>
</html>
